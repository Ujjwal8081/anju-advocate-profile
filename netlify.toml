# Netlify Configuration for Advocate Portfolio
# This file configures how Netlify builds and serves your Angular application

[build]
  command = "npm run build"
  publish = "dist/advocate-portfolio"
  environment = { NODE_VERSION = "18" }

# Redirect all requests to index.html for Angular SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and SEO Headers
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.emailjs.com;"

# Cache headers for static assets (images, fonts, etc.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache headers for JavaScript bundles
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache headers for CSS
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache index.html - must be revalidated
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Sitemap and Robots.txt headers
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=86400"

# Enable GZIP compression for text files
[[headers]]
  for = "/"
  [headers.values]
    Content-Encoding = "gzip"

# Environment variables (uncomment and add your values)
# [context.production.environment]
#   GOOGLE_ANALYTICS_ID = "G-XXXXXXXXXX"
