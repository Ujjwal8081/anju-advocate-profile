# Netlify Configuration for Advocate Portfolio
# This file configures how Netlify builds and serves your Angular application

[build]
  command = "npm run build"
  publish = "dist/advocate-portfolio"
  environment = { NODE_VERSION = "18" }

# IMPORTANT: Force HTTPS redirects first
[[redirects]]
  from = "http://advanjusingh.com/*"
  to = "https://advanjusingh.com/:splat"
  status = 301

[[redirects]]
  from = "http://www.advanjusingh.com/*"
  to = "https://advanjusingh.com/:splat"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# SPA routing - MUST come after redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and SEO Headers
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.emailjs.com https://www.googletagmanager.com https://www.google-analytics.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maps.googleapis.com; img-src 'self' data: https: https://*.google.com https://*.gstatic.com https://*.googleapis.com; connect-src 'self' https://api.emailjs.com https://www.google-analytics.com https://*.googleapis.com https://*.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://www.google.com https://*.google.com https://maps.google.com;"

    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"



# Cache headers for static assets (IMPORTANT for performance)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML files
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
