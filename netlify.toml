# Netlify Configuration for Advocate Portfolio
# This file configures how Netlify builds and serves your Angular application

[build]
  command = "npm run build"
  publish = "dist/advocate-portfolio"
  environment = { NODE_VERSION = "18" }

# IMPORTANT: Force HTTPS redirects first
[[redirects]]
  from = "http://advanjusingh.com/*"
  to = "https://advanjusingh.com/:splat"
  status = 301

[[redirects]]
  from = "http://www.advanjusingh.com/*"
  to = "https://advanjusingh.com/:splat"
  status = 301

# Optional: Redirect www to non-www (choose one approach)
# [[redirects]]
#   from = "https://www.advanjusingh.com/*"
#   to = "https://advanjusingh.com/:splat"
#   status = 301

# SPA routing - MUST come after redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and SEO Headers
[[headers]]
  for = "/*"
  [headers.values]
    # CSP with EmailJS support - FIXED VERSION
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://api.emailjs.com; style-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:; connect-src 'self' https://api.emailjs.com; font-src 'self' data:; frame-src 'none';"
    
    # Additional security headers
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Cache headers for static assets (IMPORTANT for performance)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML files
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
